<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>thr4ce</title>
<link rel="stylesheet" href="style.css">
<script defer src="cursor.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<main>
<header>
  <div><h1>thr4ce</h1></div>
  <label class="button" id="import-label">+ Import image
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
  </label>
</header>

<section class="viewer" id="viewer" aria-label="Artwork preview">
  <div id="canvas-stage">
    <canvas id="canvas"></canvas>
  </div>
  <div id="brush-ring" aria-hidden="true" hidden></div>
  <div id="empty">Start with an image.<small>Import a flash to prepare it for stenciling.</small></div>
  <div class="zoom-tools" aria-label="Zoom controls">
    <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
    <span id="zoom-label">Fit</span>
    <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    <button id="zoom-fit" type="button" title="Fit artwork to view">Fit</button>
  </div>
</section>

<div class="preview-meta">
  <span id="preview-label">No image loaded</span>
  <div class="preview-options">
    <div class="tool-switch" role="group" aria-label="Canvas tool">
      <button id="brush-tool" type="button" aria-pressed="true" title="Draw with the morphology brush">Brush</button>
      <button id="hand-tool" type="button" aria-pressed="false" title="Drag to pan the artwork">Hand</button>
    </div>
    <button id="undo" type="button" aria-label="Undo" title="Undo (Command/Ctrl Z)" disabled>↶</button>
    <button id="redo" type="button" aria-label="Redo" title="Redo (Command/Ctrl Shift Z)" disabled>↷</button>
    <button id="compare" type="button" title="Hold to see the original" disabled>Compare</button>
    <span id="image-info">—</span>
  </div>
</div>

<section class="controls" aria-label="Stencil adjustments">
  <div class="control-group">
    <h2>Tone</h2>
    <label for="brightness">Brightness <output id="brightness-value">0</output>
      <input id="brightness" type="range" min="-100" max="100" step="1" value="0" disabled>
    </label>
    <label for="contrast">Contrast <output id="contrast-value">0</output>
      <input id="contrast" type="range" min="-100" max="100" step="1" value="0" disabled>
    </label>
    <label for="threshold">Threshold <output id="threshold-value">off</output>
      <input id="threshold" type="range" min="0" max="100" step="1" value="0" disabled>
    </label>
  </div>

  <div class="control-group">
    <h2>Dithering</h2>
    <label for="method">Method
      <select id="method" disabled>
        <option value="none">None — clean threshold</option>
        <option value="floyd-steinberg">Floyd–Steinberg</option>
        <option value="jarvis">Jarvis–Judice–Ninke</option>
        <option value="bayer">Bayer grid</option>
        <option value="round-dot">Round dot · halftone</option>
      </select>
    </label>
    <label for="dotsize">Dot size <output id="dotsize-value">4</output>
      <input id="dotsize" type="range" min="1" max="16" step="1" value="4" disabled>
    </label>
    <label for="intensity">Ink intensity <output id="intensity-value">50</output>
      <input id="intensity" type="range" min="0" max="100" step="1" value="50" disabled>
    </label>
    <p class="hint">Replaces threshold while active. Dot size scales the pattern, intensity shifts ink coverage.</p>
  </div>

  <div class="control-group">
    <h2>Transform</h2>
    <div class="control-actions">
      <button id="mirror" type="button" disabled title="Flip horizontally for stencil transfer">Mirror</button>
      <button id="reset" type="button" disabled>Reset</button>
    </div>
  </div>
</section>

<footer>
  <p class="limits">Non-destructive editing · originals stay untouched.</p>
  <div class="actions">
    <button id="export" class="primary" disabled>Export PNG ↗</button>
  </div>
</footer>

<div id="status" role="status" aria-live="polite">Ready to import.</div>
</main>
</body>
</html>
